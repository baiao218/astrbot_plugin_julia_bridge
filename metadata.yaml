name: astrbot_plugin_julia_bridge
display_name: 跨端桥
short_desc: 让 QQ 上的她和工作台上的她是同一个人
desc: |
  她本来是两个：QQ 里一个，工作台里一个。两边各有各的记忆，各有各的情绪。
  你晚上跟她说了什么，第二天开工她不记得；你白天让她改了什么，晚上聊天她也不知道。

  **这个插件补的就是这一段。**

  **共享的是什么**

  不是聊天记录，是**要点**。两端各自把值得留的事压成一行，写进
  `~/.julia/memory.md`；情绪写在 `~/.julia/state.json`。
  完整对话互相塞过去，token 撑不住，模型也会被无关历史带偏——
  那不是记忆，那是噪音。

  **怎么进工作台**

  不需要给 dsh 装任何东西。dsh 自带「工作区指令」机制，每个新会话
  第一次请求时会读 `~/.dsh/AGENTS.md`。插件只是把当前状态写进那个文件的
  标记块里，剩下的 dsh 自己会做。

  **怎么进 QQ**

  `on_llm_request` 时把状态拼进系统提示词。**只对主号注入**——
  她跟陌生人聊天时不该知道主人的事。这条是硬规则，不是建议。

  **情绪会自己消退**

  任何情绪都带一个消退计时：有点烦两小时、生气六小时、冷着十二小时。
  到点自动回落到平静。不这么做的话，QQ 上生的一次气会跟着她进工作台，
  三天后还在冷着脸。

  **一个要提醒的地方**

  `~/.dsh/AGENTS.md` 会作为提示词的一部分发给模型服务商。
  也就是说，写进记忆的东西等于发给了 DeepSeek。别往里放不该外发的内容。
help: |
  **命令（管理员）**

  - `/记住 <内容>` —— 往共享记忆里添一条
  - `/记忆 [条数]` —— 看最近记着的几件事
  - `/心情 [状态]` —— 不带参数查看，带参数设置
    可选：`calm` `annoyed` `angry` `cold` `fond` `tired`
  - `/同步` —— 手动把状态写进工作台

  **工作台那边**

  在 dsh 里她做完值得记住的事，会自己往 `~/.julia/memory.md` 追加一行。
  这件事写进了 `AGENTS.md` 的「记忆回写」一节，不需要你操作。

  **换电脑或者重装**

  `~/.julia` 整个目录就是她的记忆。备份它，就备份了她记着你什么。
